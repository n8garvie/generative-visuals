<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generative Visuals — Particle Surface Studio</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<aside id="panel">
  <h1>Particle Surface Studio</h1>

  <section>
    <h2>Shape</h2>
    <label class="row">
      <span>Preset</span>
      <select id="preset">
        <option value="shell">Shell</option>
        <option value="flower">Flower</option>
        <option value="ellipse">Ellipse</option>
        <option value="mesh">Mesh</option>
        <option value="blob">Blob</option>
      </select>
    </label>
    <div id="shape-controls"></div>
  </section>

  <section>
    <h2>View</h2>
    <div id="view-controls"></div>
    <label class="row">
      <span>Mirror</span>
      <select id="mirror">
        <option value="off">Off</option>
        <option value="x">Flip X</option>
        <option value="y">Flip Y</option>
        <option value="quad">Kaleido</option>
      </select>
    </label>
  </section>

  <section>
    <h2>Animation</h2>
    <div id="anim-controls"></div>
  </section>

  <section>
    <h2>Copies</h2>
    <div id="copies-controls"></div>
    <label class="row toggle">
      <span>Alternate colors</span>
      <input type="checkbox" id="alternate">
    </label>
  </section>

  <section>
    <h2>Texture</h2>
    <div id="texture-controls"></div>
  </section>

  <section>
    <h2>Color</h2>
    <label class="row"><span>Front / red</span><input type="color" id="colorA" value="#ff2435"></label>
    <label class="row"><span>Back / blue</span><input type="color" id="colorB" value="#2244ee"></label>
    <label class="row"><span>Sparkle accent</span><input type="color" id="colorC" value="#ffe45c"></label>
    <label class="row"><span>Background</span><input type="color" id="colorBg" value="#cdb7ba"></label>
  </section>

  <section class="actions">
    <button id="play">Pause</button>
    <button id="randomize">Randomize</button>
    <button id="export">Export PNG</button>
    <button id="export-gif">Export GIF</button>
    <button id="export-video">Export Video</button>
    <!-- Compatibility shim: a stale cached app.js (pre-animation) wires a
         Drift button and crashes during init without it, blanking the canvas.
         Remove once GitHub Pages caches have long since rolled over. -->
    <button id="drift" hidden>Drift</button>
  </section>

  <p id="status" class="hint" aria-live="polite"></p>
  <p class="hint">Tip: jitter 0 gives crisp moiré mesh, high jitter gives spray-paint grain.</p>
</aside>

<main id="stage">
  <canvas id="canvas"></canvas>
  <button id="fullscreen" aria-label="Enter fullscreen" title="Toggle fullscreen">
    <svg class="icon-max" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg class="icon-min" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M9 3v6H3M21 9h-6V3M15 21v-6h6M3 15h6v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</main>

<script src="gif.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
